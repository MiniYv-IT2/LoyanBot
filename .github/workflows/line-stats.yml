name: 更新源码统计

on:
  push:
    branches: [allnew]
  workflow_dispatch:

jobs:
  line-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 统计行数并更新 README
        run: python3 scripts/line_stats.py
      
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add svg/ README*.md
          git diff --cached --quiet || git commit -m "chore: 自动更新源码统计 [skip ci]"
          git push
