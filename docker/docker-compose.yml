services:
  loyan:
    build: .
    image: loyan:latest
    container_name: loyan
    ports:
      - "5090:5090"
    volumes:
      # 持久化：配置 / 实例 / 日志
      - loyan_storage:/loyan/storage
      # 可选：挂载自定义插件目录（自动链接到 loyan/plugins_custom/）
      - ./plugins_custom:/loyan/plugins_custom:ro
    environment:
      - TZ=Asia/Shanghai
      # GRACYBOT_HOME 不设则自动检测 CWD（/loyan 下有 bot.py）
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  loyan_storage:
